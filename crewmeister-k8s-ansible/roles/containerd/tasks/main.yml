---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    lock_timeout: 180

- name: Ensure containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Read default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Use systemd cgroups in containerd
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
  notify: Restart containerd

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
