---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download official Kubernetes apt repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/Release.key"
    dest: /tmp/crewmeister-kubernetes-release.key
    mode: '0644'

- name: Install Kubernetes apt signing key if missing
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/crewmeister-kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Configure per-minor Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/ /"
    filename: kubernetes
    state: present
    update_cache: true

- name: Install kubelet, kubeadm, kubectl from pinned minor repository
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true
    lock_timeout: 180

- name: Hold Kubernetes packages to avoid accidental upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Set kubelet node IP from VMware NAT inventory
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    owner: root
    group: root
    mode: '0644'
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"

- name: Enable kubelet (it becomes healthy after bootstrap)
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true
