---
- name: Show all Kubernetes nodes
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
  register: cluster_nodes
  changed_when: false

- name: Display Kubernetes node status
  ansible.builtin.debug:
    var: cluster_nodes.stdout_lines

- name: Show networking pods
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get pods -o wide
  register: cluster_pods
  changed_when: false

- name: Display system pod status
  ansible.builtin.debug:
    var: cluster_pods.stdout_lines
