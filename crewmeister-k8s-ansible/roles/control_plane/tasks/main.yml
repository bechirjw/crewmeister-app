---
- name: Check if Kubernetes control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Read installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: installed_kubeadm_version
  changed_when: false

- name: Render kubeadm v1beta4 init configuration
  ansible.builtin.template:
    src: kubeadm-init-config.yaml.j2
    dest: /etc/kubernetes/crewmeister-kubeadm-init.yaml
    owner: root
    group: root
    mode: '0600'
  when: not admin_conf.stat.exists

- name: Validate kubeadm initialization configuration
  ansible.builtin.command: >-
    kubeadm config validate --config /etc/kubernetes/crewmeister-kubeadm-init.yaml
  changed_when: false
  when: not admin_conf.stat.exists

- name: Initialize control plane (creates temporary bootstrap credentials)
  ansible.builtin.command: >-
    kubeadm init --config /etc/kubernetes/crewmeister-kubeadm-init.yaml
  no_log: true
  when: not admin_conf.stat.exists

- name: Create personal kubeconfig directory on master
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Copy cluster-admin kubeconfig for master local administration
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Create short-lived worker join command (not logged)
  ansible.builtin.command: "kubeadm token create --ttl {{ kubeadm_token_ttl }} --print-join-command"
  register: kubeadm_worker_join
  changed_when: true
  no_log: true

- name: Keep join command transiently in Ansible memory
  ansible.builtin.set_fact:
    worker_join_command: "{{ kubeadm_worker_join.stdout }}"
  no_log: true
