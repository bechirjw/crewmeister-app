---
# Lab use only: copies cluster-admin kubeconfig to WSL. Treat as a secret.
- name: Securely copy admin kubeconfig to WSL workstation
  hosts: first_control_plane
  gather_facts: false
  become: true
  tasks:
    - name: Read control-plane kubeconfig
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: kubeconfig_read
      no_log: true

    - name: Ensure WSL kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Write kubeconfig to WSL home with strict permissions
      ansible.builtin.copy:
        content: "{{ kubeconfig_read.content | b64decode }}"
        dest: "{{ lookup('env', 'HOME') }}/.kube/crewmeister-admin.conf"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
