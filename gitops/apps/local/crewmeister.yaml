apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crewmeister-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bechirjw/crewmeister-app.git
    targetRevision: main
    path: helm/crewmeister
    helm:
      releaseName: crewmeister
      valueFiles:
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: crewmeister
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
