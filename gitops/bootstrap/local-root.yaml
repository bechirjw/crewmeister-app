apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crewmeister-local-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bechirjw/crewmeister-app.git
    targetRevision: main
    path: gitops/apps/local
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
