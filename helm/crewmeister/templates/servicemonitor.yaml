{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "crewmeister.fullname" . }}-app
  labels:
    {{- include "crewmeister.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/name: crewmeister
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval | quote }}
{{- end }}
