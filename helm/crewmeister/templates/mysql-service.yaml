apiVersion: v1
kind: Service
metadata:
  name: {{ include "crewmeister.fullname" . }}-mysql
  labels:
    {{- include "crewmeister.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: crewmeister
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mysql
