{{- $cfg := .Values.hpa | default dict -}}
{{- if (get $cfg "enabled" | default false) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "crewmeister.fullname" . }}-app
  labels:
    {{- include "crewmeister.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "crewmeister.fullname" . }}-app
  minReplicas: {{ get $cfg "minReplicas" | default 2 }}
  maxReplicas: {{ get $cfg "maxReplicas" | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ get $cfg "targetCPUUtilizationPercentage" | default 70 }}
{{- end }}
