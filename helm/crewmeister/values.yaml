fullnameOverride: crewmeister

app:
  replicas: 1
  image:
    repository: ghcr.io/bechirjw/crewmeister-app
    tag: "1.0"
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 650m, memory: 640Mi}
  nodeSelector: {}
  affinity: {}
  topologySpreadConstraints: []
  service:
    type: ClusterIP
    port: 8080

mysql:
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  database: challenge
  username: crewmeister
  existingSecret: crewmeister-db
  passwordKey: app-password
  rootPasswordKey: root-password
  nodeSelector: {}
  resources:
    requests: {cpu: 150m, memory: 384Mi}
    limits: {cpu: 800m, memory: 1Gi}
  persistence:
    storageClassName: ""
    size: 5Gi

serviceMonitor:
  enabled: false
  interval: 60s
