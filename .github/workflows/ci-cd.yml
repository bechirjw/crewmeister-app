name: crewmeister-ci-cd

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'mvnw'
      - '.mvn/**'
      - 'helm/crewmeister/Chart.yaml'
      - 'helm/crewmeister/values.yaml'
      - 'helm/crewmeister/templates/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: challenge
          MYSQL_USER: crewmeister
          MYSQL_PASSWORD: ci-app-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Accurate branch/PR analysis by SonarQube Cloud
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven verification against MySQL
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/challenge
          SPRING_DATASOURCE_WRITER_URL: jdbc:mysql://127.0.0.1:3306/challenge
          SPRING_DATASOURCE_USERNAME: crewmeister
          SPRING_DATASOURCE_PASSWORD: ci-app-password
        run: |
          chmod +x ./mvnw
          # Instrument the existing Maven test run and generate JaCoCo XML.
          ./mvnw -B -ntp \
            org.jacoco:jacoco-maven-plugin:0.8.16:prepare-agent \
            verify \
            org.jacoco:jacoco-maven-plugin:0.8.16:report
      - name: Verify JaCoCo XML coverage report
        run: |
          if [[ ! -s target/site/jacoco/jacoco.xml ]]; then
            echo "::error::Missing target/site/jacoco/jacoco.xml; inspect tests and Maven Surefire/Failsafe argLine configuration."
            exit 1
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Helm lint and render for both environments
        run: |
          helm lint helm/crewmeister -f helm/crewmeister/values-local.yaml
          helm lint helm/crewmeister -f helm/crewmeister/values-aks.yaml
          helm template crewmeister helm/crewmeister -f helm/crewmeister/values-local.yaml >/dev/null
          helm template crewmeister helm/crewmeister -f helm/crewmeister/values-aks.yaml >/dev/null

      # Fork PRs cannot access repository secrets. Never expose SONAR_TOKEN to fork code.
      - name: SonarQube Cloud - code quality and JaCoCo coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Configure SONAR_TOKEN (secret), SONAR_ORGANIZATION and SONAR_PROJECT_KEY (repository variables)."
            exit 1
          fi
          ./mvnw -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            "-Dsonar.organization=${SONAR_ORGANIZATION}" \
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  security:
    name: Security - Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks - detect leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  source-security:
    name: Security - IaC misconfigurations
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy - IaC report (non-blocking)
        id: trivy_iac
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          skip-files: pom.xml
          format: json
          output: trivy-iac-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Warn if Trivy IaC scan failed
        if: steps.trivy_iac.outcome == 'failure'
        run: echo "::warning::Trivy IaC scan failed; check logs. Report may be unavailable."

      - name: Upload Trivy IaC report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-report
          path: trivy-iac-report.json
          if-no-files-found: warn
          retention-days: 30

  image-security:
    name: Security - Docker image on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image for PR scan (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: crewmeister-app:pr-scan
          cache-from: type=gha

      - name: Trivy - PR image report (non-blocking)
        id: trivy_pr
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: crewmeister-app:pr-scan
          scanners: vuln
          format: json
          output: trivy-pr-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Warn if Trivy PR scan failed
        if: steps.trivy_pr.outcome == 'failure'
        run: echo "::warning::Trivy PR image scan failed; check logs. Report may be unavailable."

      - name: Upload Trivy PR report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-pr-security-report
          path: trivy-pr-report.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, security, source-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build and generate a non-blocking scan report before GHCR authentication.
      - name: Build Docker image (local, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/crewmeister-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - published image report (non-blocking)
        id: trivy_publish
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/crewmeister-app:sha-${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-publish-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Warn if Trivy publish scan failed
        if: steps.trivy_publish.outcome == 'failure'
        run: echo "::warning::Trivy publish image scan failed; check logs. Report may be unavailable."

      - name: Upload Trivy publish report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-publish-security-report
          path: trivy-publish-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Authenticate to GHCR after reporting
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image and capture digest
        id: build
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/crewmeister-app:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not retrieve a valid GHCR image digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  promote-local:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Prepare GitOps promotion change
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          path = Path('helm/crewmeister/values-local.yaml')
          original = path.read_text()
          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), digest
          updated, count = re.subn(r'(?m)^(\s*digest:\s*)sha256:[0-9a-f]{64}(\s*)$', lambda m: m.group(1) + digest + m.group(2), original)
          if count != 1:
              raise SystemExit('Expected exactly one SHA256 digest in values-local.yaml')
          path.write_text(updated)
          PYCODE
          if git diff --quiet -- helm/crewmeister/values-local.yaml; then
            echo "Image digest unchanged; nothing to promote."
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi
      - name: Open or update promotion pull request
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c ci/promote-local-image
          git add helm/crewmeister/values-local.yaml
          git commit -m "chore(gitops): promote Crewmeister image digest"
          git push --force --set-upstream origin ci/promote-local-image
          if gh pr view ci/promote-local-image --json number >/dev/null 2>&1; then
            echo 'Updated existing promotion PR'
          else
            gh pr create --base main --head ci/promote-local-image \
            --title 'chore(gitops): promote Crewmeister image to VMware' \
            --body 'CI passed Maven/Helm checks, built and published this immutable GHCR image digest. Merge to let Argo CD deploy it.'
          fi

